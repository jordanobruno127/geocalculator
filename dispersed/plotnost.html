<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Плотность грунта — Geocalculator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://unpkg.com/xlsx@0.21.0/dist/xlsx.full.min.js"></script>
<style>
:root{
  --soil-peat:   #F2E9D8;
  --soil-peat-2: #EAE0C9;
  --soil-clay:   #8A7355;
  --soil-loam:   #B06B34;
  --soil-sand:   #C98F45;
  --paper:       #3B2E20;
  --paper-dim:   #7A6A52;
  --line:        #D9C9A3;
  --ok:          #7A9B6E;
  --warn:        #A6462E;

  --font-display: 'Golos Text', -apple-system, sans-serif;
  --font-body: 'Golos Text', -apple-system, sans-serif;
  --font-mono: 'JetBrains Mono', monospace;

  --radius: 3px;
}

*{ box-sizing:border-box; margin:0; padding:0; }

html, body{
  width:100%;
  max-width:100%;
  overflow-x:hidden;
  background-color:var(--soil-peat);
  background-image:
    radial-gradient(circle at 1px 1px, rgba(176,107,52,0.08) 1px, transparent 0),
    repeating-linear-gradient(155deg, rgba(176,107,52,0.05) 0px, rgba(176,107,52,0.05) 1px, transparent 1px, transparent 26px),
    repeating-linear-gradient(65deg, rgba(138,115,85,0.045) 0px, rgba(138,115,85,0.045) 1px, transparent 1px, transparent 34px);
  background-size: 18px 18px, auto, auto;
  color:var(--paper);
  font-family:var(--font-body);
  font-size:17px;
  line-height:1.55;
  min-height:100vh;
}

body{
  min-height:100vh;
  display:flex;
  flex-direction:column;
}

/* ===== верхняя панель навигации ===== */
.top-bar{
  width:100%;
  padding:18px 32px 0;
  display:flex;
  justify-content:flex-end;
  gap:10px;
}
.top-bar button{
  font-family:var(--font-body);
  font-weight:600;
  font-size:14.5px;
  padding:12px 22px;
  border-radius:var(--radius);
  cursor:pointer;
  transition:opacity .15s, border-color .15s, color .15s;
}
#btn-back{
  background:var(--soil-peat-2);
  border:1px solid var(--line);
  color:var(--paper);
}
#btn-back:hover{ border-color:var(--soil-loam); color:var(--soil-loam); }
#btn-home{
  background:var(--soil-loam);
  border:1px solid var(--soil-loam);
  color:var(--soil-peat);
}
#btn-home:hover{ opacity:.88; }

/* ===== шапка ===== */
header{
  max-width:920px;
  margin:0 auto;
  padding:12px 32px 40px;
  text-align:center;
  border-bottom:1px solid var(--line);
  width:100%;
}
header h1{
  font-family:var(--font-display);
  font-weight:700;
  font-size:42px;
  line-height:1.2;
  color:var(--paper);
}
header .lede{
  font-size:17px;
  color:var(--paper-dim);
  max-width:600px;
  margin:18px auto 0;
}
header .note-link{
  font-size:14.5px;
  color:var(--paper-dim);
  max-width:600px;
  margin:12px auto 0;
}
header .note-link a{
  color:var(--soil-loam);
  text-decoration:none;
}
header .note-link a:hover{ text-decoration:underline; }

/* ===== контентная обёртка ===== */
.wrap{
  max-width:1240px;
  margin:0 auto;
  padding:40px 32px 64px;
  width:100%;
  flex:1 0 auto;
}

.section-label{
  font-family:var(--font-mono);
  font-size:13px;
  letter-spacing:.1em;
  text-transform:uppercase;
  color:var(--paper-dim);
  margin-bottom:16px;
  text-align:center;
}

/* ===== кнопки выбора метода ===== */
.method-buttons{
  display:flex;
  justify-content:center;
  gap:10px;
  flex-wrap:wrap;
}

.action-btn.method-btn{
  padding:12px 20px;
  border-radius:var(--radius);
  border:1px solid var(--line);
  background-color:var(--soil-peat-2);
  color:var(--paper);
  cursor:pointer;
  font-family:var(--font-body);
  font-size:14.5px;
  font-weight:600;
  transition:border-color .15s, color .15s, background-color .15s;
  min-width:260px;
}
.action-btn.method-btn:hover{
  border-color:var(--soil-loam);
  color:var(--soil-loam);
}
.action-btn.method-btn.active{
  background-color:var(--soil-loam);
  border-color:var(--soil-loam);
  color:var(--soil-peat);
}

/* ===== контейнеры испытаний ===== */
.test-container{
  display:none;
  margin-top:36px;
}
.test-container.active{
  display:block;
}

.tests-container{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:20px;
}

.test-flex{
  display:flex;
  align-items:flex-start;
  justify-content:center;
  gap:15px;
  opacity:0;
  transform:translateY(20px);
  animation:slideIn .5s ease forwards;
  width:100%;
  max-width:900px;
  margin:0 auto;
  position:relative;
}

.calc-wrapper{
  display:flex;
  align-items:flex-start;
  justify-content:center;
  width:100%;
  max-width:640px;
  margin:0 auto;
}

.calculation-container{
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:22px 24px;
  background-color:var(--soil-peat-2);
  min-width:500px;
  max-width:640px;
  margin:0 auto;
  display:block;
  box-sizing:border-box;
}

.sample-block{
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:12px 14px;
  margin-bottom:10px;
  background-color:var(--soil-peat);
  display:flex;
  align-items:center;
  justify-content:space-between;
  opacity:0;
  transform:translateY(10px);
  animation:slideIn .4s ease forwards;
  overflow-x:auto;
  position:relative;
}
.sample-block:nth-child(1){ animation-delay:0s; }
.sample-block:nth-child(2){ animation-delay:.15s; }
.sample-block:nth-child(3){ animation-delay:.3s; }
.sample-block:nth-child(4){ animation-delay:.45s; }

.sample-content{ flex-grow:1; }
.sample-row{
  display:flex;
  flex-direction:column;
  gap:8px;
}
.sample-row input, .sample-row select{
  width:100%;
  padding:9px 10px;
  border-radius:var(--radius);
  border:1px solid var(--line);
  background:var(--soil-peat-2);
  color:var(--paper);
  font-family:var(--font-body);
  font-size:13.5px;
}
.sample-row input::placeholder{ color:var(--paper-dim); }
.sample-row input:focus, .sample-row select:focus{ outline:none; border-color:var(--soil-loam); }

.volume-group{
  display:flex;
  gap:8px;
  align-items:center;
}
.volume-group input{ flex:3; width:70%; }
.volume-group select{ flex:1; width:30%; min-width:60px; max-width:80px; }

.humidity-group{
  display:flex;
  gap:8px;
  align-items:center;
}
.humidity-group input{ flex:3; }
.humidity-group select{ flex:1; min-width:70px; }

.sample-result{
  font-family:var(--font-mono);
  font-size:12.5px;
  color:var(--paper-dim);
  margin-left:10px;
  min-width:60px;
  text-align:right;
  flex-shrink:0;
}

.action-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-top:8px;
  flex-wrap:wrap;
  gap:8px;
}

.btn-calc-green{
  padding:10px 18px;
  border-radius:var(--radius);
  border:1px solid var(--soil-loam);
  background-color:var(--soil-loam);
  color:var(--soil-peat);
  cursor:pointer;
  font-family:var(--font-body);
  font-size:14px;
  font-weight:600;
  transition:opacity .15s;
}
.btn-calc-green:hover{ opacity:.88; }

.btn-clear{
  padding:10px 18px;
  border-radius:var(--radius);
  border:1px solid var(--line);
  background-color:var(--soil-peat-2);
  color:var(--paper);
  cursor:pointer;
  font-family:var(--font-body);
  font-size:14px;
  font-weight:600;
  transition:border-color .15s, color .15s;
}
.btn-clear:hover{ border-color:var(--soil-loam); color:var(--soil-loam); }

.btn-add-sample{
  padding:10px 18px;
  border-radius:var(--radius);
  border:1px solid var(--line);
  background-color:var(--soil-peat-2);
  color:var(--paper);
  cursor:pointer;
  font-family:var(--font-body);
  font-size:14px;
  font-weight:600;
  transition:border-color .15s, color .15s;
}
.btn-add-sample:hover{ border-color:var(--soil-loam); color:var(--soil-loam); }

.btn-delete-sample{
  position:absolute;
  top:8px;
  right:8px;
  width:24px;
  height:24px;
  border-radius:50%;
  border:1px solid var(--warn);
  background-color:var(--soil-peat-2);
  color:var(--warn);
  cursor:pointer;
  font-size:13px;
  font-weight:600;
  line-height:1;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:background-color .15s, color .15s;
  flex-shrink:0;
}
.btn-delete-sample:hover{ background-color:var(--warn); color:var(--soil-peat); }

.delete-btn{
  padding:9px 16px;
  border-radius:var(--radius);
  border:1px solid var(--warn);
  background-color:var(--soil-peat);
  color:var(--warn);
  cursor:pointer;
  font-family:var(--font-body);
  font-size:13.5px;
  font-weight:600;
  transition:background-color .15s, color .15s;
  position:absolute;
  top:0;
  right:-92px;
}
.delete-btn:hover{ background-color:var(--warn); color:var(--soil-peat); }

.average-container{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-top:10px;
  padding:12px 14px;
  background-color:var(--soil-peat);
  border:1px solid var(--line);
  border-radius:var(--radius);
  gap:10px;
  flex-wrap:wrap;
}
.average-label{
  font-size:15px;
  color:var(--paper);
}
.result-average{
  font-family:var(--font-mono);
  font-weight:600;
  font-size:15px;
  color:var(--soil-loam);
  text-align:right;
}

/* ===== футер ===== */
footer{
  flex-shrink:0;
  max-width:920px;
  margin:36px auto 0;
  padding:36px 32px 40px;
  border-top:1px solid var(--line);
  text-align:center;
  font-family:var(--font-mono);
  font-size:12.5px;
  color:var(--paper-dim);
  width:100%;
}

@keyframes slideIn{
  to{ opacity:1; transform:translateY(0); }
}

@media (max-width:900px){
  header h1{ font-size:30px; }
  .top-bar{ padding:14px 20px 0; }
  header{ padding:56px 20px 32px; }
  .wrap{ padding:28px 20px 48px; }

  .action-btn.method-btn{ width:100%; min-width:0; max-width:400px; }

  .test-flex{ flex-direction:column; align-items:center; }
  .calc-wrapper{ width:100%; max-width:90%; margin:0 auto; }
  .calculation-container{
    width:100%;
    max-width:90%;
    min-width:280px;
    margin:0 auto;
  }
  .delete-btn{
    position:static;
    align-self:flex-end;
    margin-top:10px;
  }
}

@media (max-width:400px){
  .calculation-container{ min-width:260px; max-width:90%; }
}
</style>
</head>
<body>

<div class="top-bar">
  <button id="btn-back" onclick="history.back()">Назад</button>
  <button id="btn-home" onclick="location.href='/'">Главная</button>
</div>

<header>
  <h1>Плотность грунта</h1>
  <p class="lede">Выберите метод для расчёта плотности грунта, затем введите данные образцов в таблицу. Для каждого испытания рассчитывается средняя плотность в г/см³. Расчёт ведётся в соответствии с ГОСТ 5180-2015.</p>
</header>

<div class="wrap">

  <div class="section-label">Метод расчёта</div>
  <div class="method-buttons">
    <button class="action-btn method-btn initial" id="btn-ring" onclick="App.toggleMethod('ring')" aria-label="Плотность методом режущего кольца">Плотность методом режущего кольца</button>
    <button class="action-btn method-btn initial" id="btn-paraffin" onclick="App.toggleMethod('paraffin')" aria-label="Плотность методом парафинирования">Плотность методом парафинирования</button>
    <button class="action-btn method-btn initial" id="btn-dry" onclick="App.toggleMethod('dry')" aria-label="Плотность сухого грунта">Плотность сухого грунта</button>
    <button class="action-btn method-btn initial" id="btn-particle" onclick="App.toggleMethod('particle')" aria-label="Плотность частиц грунта">Плотность частиц грунта</button>
  </div>

  <div id="test-container-ring" class="test-container">
    <div class="tests-container" id="tests-container-ring"></div>
    <div style="text-align:center; margin-top:25px;">
      <button class="btn-add-sample" style="min-width:260px; padding:12px 22px; font-size:14.5px;" onclick="App.addTest('ring')" aria-label="Добавить новое испытание">+ Добавить испытание</button>
    </div>
  </div>

  <div id="test-container-paraffin" class="test-container">
    <div class="tests-container" id="tests-container-paraffin"></div>
    <div style="text-align:center; margin-top:25px;">
      <button class="btn-add-sample" style="min-width:260px; padding:12px 22px; font-size:14.5px;" onclick="App.addTest('paraffin')" aria-label="Добавить новое испытание">+ Добавить испытание</button>
    </div>
  </div>

  <div id="test-container-dry" class="test-container">
    <div class="tests-container" id="tests-container-dry"></div>
    <div style="text-align:center; margin-top:25px;">
      <button class="btn-add-sample" style="min-width:260px; padding:12px 22px; font-size:14.5px;" onclick="App.addTest('dry')" aria-label="Добавить новое испытание">+ Добавить испытание</button>
    </div>
  </div>

  <div id="test-container-particle" class="test-container">
    <div class="tests-container" id="tests-container-particle"></div>
    <div style="text-align:center; margin-top:25px;">
      <button class="btn-add-sample" style="min-width:260px; padding:12px 22px; font-size:14.5px;" onclick="App.addTest('particle')" aria-label="Добавить новое испытание">+ Добавить испытание</button>
    </div>
  </div>

</div>

<footer>
  © 2026 Geocalculator. Инженерно-геологические расчеты онлайн
</footer>

<script>
    const App = {
        init() {
            document.addEventListener('DOMContentLoaded', () => {
                if (!window.XLSX) {
                    console.error("SheetJS library is not loaded");
                } else {
                    console.log("SheetJS library loaded successfully");
                }
                console.log('Density page loaded');
            });
        },

        toggleMenu() {
            document.getElementById("sidebar").classList.toggle("open");
        },

        navigate(url) {
            location.href = url;
        },

        focusNextInput(event, input) {
            if (event.key === "Enter") {
                event.preventDefault();
                const calcDiv = input.closest(".calculation-container");
                const method = calcDiv.querySelector(".btn-calc-green").getAttribute("onclick").match(/'([^']+)'/)[1];
                const sampleBlocks = Array.from(calcDiv.querySelectorAll(".sample-block"));
                const allInputs = method === 'dry' 
                    ? Array.from(calcDiv.querySelectorAll(".sample-row input")) // Только input для dry
                    : Array.from(calcDiv.querySelectorAll(".sample-row input, .sample-row select")); // input и select для ring, paraffin, particle
                const currentIndex = allInputs.indexOf(input);
                const currentSampleBlock = input.closest(".sample-block");
                const currentSampleIndex = sampleBlocks.indexOf(currentSampleBlock);

                if (currentIndex === allInputs.length - 1 && currentSampleIndex === sampleBlocks.length - 1) {
                    // Последнее поле последнего sample-block → запуск расчёта
                    this.calculateTest(calcDiv.querySelector(".btn-calc-green"), method);
                } else {
                    // Переход к следующему полю
                    const nextIndex = (currentIndex + 1) % allInputs.length;
                    allInputs[nextIndex].focus();
                }
            }
        },

        toggleMethod(method) {
            const buttons = ['ring', 'paraffin', 'dry', 'particle'].map(id => document.getElementById(`btn-${id}`));
            buttons.forEach(btn => btn.classList.remove('initial'));
            const containers = ['ring', 'paraffin', 'dry', 'particle'].map(id => document.getElementById(`test-container-${id}`));
            containers.forEach(container => container.classList.remove('active'));
            document.getElementById(`test-container-${method}`).classList.add('active');
            buttons.forEach(btn => btn.classList.remove('active'));
            document.getElementById(`btn-${method}`).classList.add('active');
            if (!document.getElementById(`tests-container-${method}`).querySelector('.test-flex')) {
                this.addTest(method);
            }
        },

        addTest(method) {
            const container = document.getElementById(`tests-container-${method}`);
            const testFlex = document.createElement("div");
            testFlex.classList.add("test-flex");

            const calcWrapper = document.createElement("div");
            calcWrapper.classList.add("calc-wrapper");

            const calcDiv = document.createElement("div");
            calcDiv.classList.add("calculation-container");

            let sampleContent;
            if (method === 'ring') {
                sampleContent = `
                    <div class="sample-block">
                        <div class="sample-content">
                            <div class="sample-row">
                                <input type="number" class="ring-volume" placeholder="Объём кольца, см³" aria-label="Объём кольца" onkeypress="App.focusNextInput(event, this)">
                                <input type="number" class="ring-weight" placeholder="Вес кольца, г" aria-label="Вес кольца" onkeypress="App.focusNextInput(event, this)">
                                <input type="number" class="soil-ring-weight" placeholder="Вес грунта с кольцом, г" aria-label="Вес грунта с кольцом" onkeypress="App.focusNextInput(event, this)">
                            </div>
                        </div>
                        <div class="sample-result">-</div>
                    </div>
                `;
            } else if (method === 'paraffin') {
                sampleContent = `
                    <div class="sample-block">
                        <div class="sample-content">
                            <div class="sample-row">
                                <input type="number" class="soil-mass-before" placeholder="Масса грунта до парафинирования, г" aria-label="Масса грунта до парафинирования" onkeypress="App.focusNextInput(event, this)">
                                <input type="number" class="soil-mass-after" placeholder="Масса грунта после парафинирования, г" aria-label="Масса грунта после парафинирования" onkeypress="App.focusNextInput(event, this)">
                                <input type="number" class="paraffin-soil-water" placeholder="Вес парафинированного грунта в воде, г" aria-label="Вес парафинированного грунта в воде" onkeypress="App.focusNextInput(event, this)">
                            </div>
                        </div>
                        <div class="sample-result">-</div>
                    </div>
                `;
            } else if (method === 'dry') {
                sampleContent = `
                    <div class="sample-block">
                        <div class="sample-content">
                            <div class="sample-row">
                                <input type="number" class="soil-density" placeholder="Плотность грунта, г/см³" aria-label="Плотность грунта" onkeypress="App.focusNextInput(event, this)">
                                <div class="humidity-group">
                                    <input type="number" class="soil-humidity" placeholder="Влажность грунта" aria-label="Влажность грунта" onkeypress="App.focusNextInput(event, this)">
                                    <select class="humidity-unit" aria-label="Единица измерения влажности">
                                        <option value="percent">%</option>
                                        <option value="decimal">д.е.</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                        <div class="sample-result">-</div>
                    </div>
                `;
            } else if (method === 'particle') {
                sampleContent = `
                    <div class="sample-block">
                        <div class="sample-content">
                            <div class="sample-row">
                                <div class="volume-group">
                                    <input type="number" class="pycnometer-volume" placeholder="Объем пикнометра" aria-label="Объем пикнометра" onkeypress="App.focusNextInput(event, this)">
                                    <select class="volume-unit" aria-label="Единица объема">
                                        <option value="ml">мл</option>
                                        <option value="cm3">см³</option>
                                        <option value="l">л</option>
                                    </select>
                                </div>
                                <input type="number" class="pycnometer-weight" placeholder="Вес пикнометра, г" aria-label="Вес пикнометра" onkeypress="App.focusNextInput(event, this)">
                                <input type="number" class="dry-soil-weight" placeholder="Вес сухого грунта, г" aria-label="Вес сухого грунта" onkeypress="App.focusNextInput(event, this)">
                                <input type="number" class="pycnometer-soil-water-weight" placeholder="Вес пикнометра с грунтом и водой после кипячения, г" aria-label="Вес пикнометра с грунтом и водой после кипячения" onkeypress="App.focusNextInput(event, this)">
                                <input type="number" class="temperature" placeholder="Температура, °C" aria-label="Температура испытания" min="0" max="100" onkeypress="App.focusNextInput(event, this)">
                            </div>
                        </div>
                        <div class="sample-result">-</div>
                    </div>
                `;
            }

            calcDiv.innerHTML = sampleContent;

            calcDiv.innerHTML += `
                <div class="average-container">
                    <span class="average-label">Средняя плотность:</span>
                    <div class="result-average"><span class="density-value">-</span></div>
                </div>
                <div class="action-row">
                    <div>
                        <button class="btn-calc-green" onclick="App.calculateTest(this, '${method}')" aria-label="Рассчитать">Рассчитать</button>
                        <button class="btn-add-sample" onclick="App.addSample(this, '${method}')" aria-label="Добавить образец">Добавить образец</button>
                        <button class="btn-clear" onclick="App.clearTest(this)" aria-label="Очистить поля">Очистить</button>
                    </div>
                </div>
            `;

            calcWrapper.appendChild(calcDiv);
            testFlex.appendChild(calcWrapper);
            testFlex.appendChild(document.createElement("button"));
            testFlex.lastChild.classList.add("delete-btn");
            testFlex.lastChild.textContent = "Удалить";
            testFlex.lastChild.setAttribute("aria-label", "Удалить испытание");
            testFlex.lastChild.onclick = () => testFlex.remove();
            container.appendChild(testFlex);
        },

        addSample(btn, method) {
            const calcDiv = btn.closest(".calculation-container");
            const sampleCount = calcDiv.querySelectorAll(".sample-block").length + 1;
            const sampleBlock = document.createElement("div");
            sampleBlock.classList.add("sample-block");
            sampleBlock.style.animationDelay = `${(sampleCount - 1) * 0.15}s`;

            let sampleContent;
            if (method === 'ring') {
                sampleContent = `
                    <div class="sample-content">
                        <div class="sample-row">
                            <input type="number" class="ring-volume" placeholder="Объём кольца, см³" aria-label="Объём кольца" onkeypress="App.focusNextInput(event, this)">
                            <input type="number" class="ring-weight" placeholder="Вес кольца, г" aria-label="Вес кольца" onkeypress="App.focusNextInput(event, this)">
                            <input type="number" class="soil-ring-weight" placeholder="Вес грунта с кольцом, г" aria-label="Вес грунта с кольцом" onkeypress="App.focusNextInput(event, this)">
                        </div>
                    </div>
                    <div class="sample-result">-</div>
                    <button class="btn-delete-sample" onclick="App.deleteSample(this)" aria-label="Удалить образец">—</button>
                `;
            } else if (method === 'paraffin') {
                sampleContent = `
                    <div class="sample-content">
                        <div class="sample-row">
                            <input type="number" class="soil-mass-before" placeholder="Масса грунта до парафинирования, г" aria-label="Масса грунта до парафинирования" onkeypress="App.focusNextInput(event, this)">
                            <input type="number" class="soil-mass-after" placeholder="Масса грунта после парафинирования, г" aria-label="Масса грунта после парафинирования" onkeypress="App.focusNextInput(event, this)">
                            <input type="number" class="paraffin-soil-water" placeholder="Вес парафинированного грунта в воде, г" aria-label="Вес парафинированного грунта в воде" onkeypress="App.focusNextInput(event, this)">
                        </div>
                    </div>
                    <div class="sample-result">-</div>
                    <button class="btn-delete-sample" onclick="App.deleteSample(this)" aria-label="Удалить образец">—</button>
                `;
            } else if (method === 'dry') {
                sampleContent = `
                    <div class="sample-content">
                        <div class="sample-row">
                            <input type="number" class="soil-density" placeholder="Плотность грунта, г/см³" aria-label="Плотность грунта" onkeypress="App.focusNextInput(event, this)">
                            <div class="humidity-group">
                                <input type="number" class="soil-humidity" placeholder="Влажность грунта" aria-label="Влажность грунта" onkeypress="App.focusNextInput(event, this)">
                                <select class="humidity-unit" aria-label="Единица измерения влажности">
                                    <option value="percent">%</option>
                                    <option value="decimal">д.е.</option>
                                </select>
                            </div>
                        </div>
                    </div>
                    <div class="sample-result">-</div>
                    <button class="btn-delete-sample" onclick="App.deleteSample(this)" aria-label="Удалить образец">—</button>
                `;
            } else if (method === 'particle') {
                sampleContent = `
                    <div class="sample-content">
                        <div class="sample-row">
                            <div class="volume-group">
                                <input type="number" class="pycnometer-volume" placeholder="Объем пикномeтра" aria-label="Объем пикнометра" onkeypress="App.focusNextInput(event, this)">
                                <select class="volume-unit" aria-label="Единица объема">
                                    <option value="ml">мл</option>
                                    <option value="cm3">см³</option>
                                    <option value="l">л</option>
                                </select>
                            </div>
                            <input type="number" class="pycnometer-weight" placeholder="Вес пикнометра, г" aria-label="Вес пикнометра" onkeypress="App.focusNextInput(event, this)">
                            <input type="number" class="dry-soil-weight" placeholder="Вес сухого грунта, г" aria-label="Вес сухого грунта" onkeypress="App.focusNextInput(event, this)">
                            <input type="number" class="pycnometer-soil-water-weight" placeholder="Вес пикнометра с грунтом и водой после кипячения, г" aria-label="Вес пикнометра с грунтом и водой после кипячения" onkeypress="App.focusNextInput(event, this)">
                            <input type="number" class="temperature" placeholder="Температура, °C" aria-label="Температура испытания" min="0" max="100" onkeypress="App.focusNextInput(event, this)">
                        </div>
                    </div>
                    <div class="sample-result">-</div>
                    <button class="btn-delete-sample" onclick="App.deleteSample(this)" aria-label="Удалить образец">—</button>
                `;
            }

            sampleBlock.innerHTML = sampleContent;
            calcDiv.insertBefore(sampleBlock, calcDiv.querySelector(".average-container"));
        },

        deleteSample(btn) {
            const calcDiv = btn.closest(".calculation-container");
            btn.closest(".sample-block").remove();
            const method = calcDiv.querySelector(".btn-calc-green").getAttribute("onclick").match(/'([^']+)'/)[1];
            this.calculateTest(calcDiv.querySelector(".btn-calc-green"), method);
        },

        clearTest(btn) {
            const calcDiv = btn.closest(".calculation-container");
            calcDiv.querySelectorAll(".sample-block").forEach((block, index) => {
                if (index === 0) {
                    block.querySelectorAll("input, select").forEach(input => input.value = "");
                    block.querySelector(".sample-result").textContent = "-";
                } else {
                    block.remove();
                }
            });
            calcDiv.querySelector(".density-value").textContent = "-";
        },

        calculateTest(btn, method) {
            const block = btn.closest(".test-flex");
            const samples = block.querySelectorAll(".sample-block");
            let densityValues = [];

            if (method === 'ring') {
                samples.forEach(sample => {
                    const volume = parseFloat(sample.querySelector(".ring-volume").value);
                    const ringWeight = parseFloat(sample.querySelector(".ring-weight").value);
                    const soilRingWeight = parseFloat(sample.querySelector(".soil-ring-weight").value);

                    if (isNaN(volume) || isNaN(ringWeight) || isNaN(soilRingWeight) || volume <= 0 || ringWeight < 0 || soilRingWeight <= ringWeight) {
                        sample.querySelector(".sample-result").textContent = "Некорректные данные";
                        return;
                    }

                    const density = (soilRingWeight - ringWeight) / volume;
                    sample.querySelector(".sample-result").textContent = `${density.toFixed(3)} г/см³`;
                    densityValues.push(density);
                });
            } else if (method === 'paraffin') {
                const paraffinDensity = 0.900;
                const waterDensity = 1;
                samples.forEach(sample => {
                    const massBefore = parseFloat(sample.querySelector(".soil-mass-before").value);
                    const massAfter = parseFloat(sample.querySelector(".soil-mass-after").value);
                    const paraffinSoilWater = parseFloat(sample.querySelector(".paraffin-soil-water").value);

                    if (isNaN(massBefore) || isNaN(massAfter) || isNaN(paraffinSoilWater) || massBefore <= 0 || massAfter < massBefore || paraffinSoilWater <= 0) {
                        sample.querySelector(".sample-result").textContent = "Некорректные данные";
                        return;
                    }

                    const density = (massBefore * paraffinDensity * waterDensity) / 
                        (paraffinDensity * paraffinSoilWater - waterDensity * (massAfter - massBefore));
                    sample.querySelector(".sample-result").textContent = `${density.toFixed(3)} г/см³`;
                    densityValues.push(density);
                });
            } else if (method === 'dry') {
                samples.forEach(sample => {
                    const soilDensity = parseFloat(sample.querySelector(".soil-density").value);
                    const humidity = parseFloat(sample.querySelector(".soil-humidity").value);
                    const unit = sample.querySelector(".humidity-unit").value;

                    if (isNaN(soilDensity) || isNaN(humidity) || soilDensity <= 0 || humidity < 0) {
                        sample.querySelector(".sample-result").textContent = "Некорректные данные";
                        return;
                    }

                    let density;
                    if (unit === 'percent') {
                        density = soilDensity / (1 + 0.01 * humidity);
                    } else {
                        density = soilDensity / (1 + humidity);
                    }
                    sample.querySelector(".sample-result").textContent = `${density.toFixed(3)} г/см³`;
                    densityValues.push(density);
                });
            } else if (method === 'particle') {
                const waterDensityData = [
                    [0, 0.99987], [2, 0.99997], [4, 1.00000], [6, 0.99997], [8, 0.99988], [10, 0.99973],
                    [12, 0.99953], [14, 0.99927], [16, 0.99897], [18, 0.99862], [20, 0.99823],
                    [22, 0.99780], [24, 0.99733], [26, 0.99681], [28, 0.99626], [30, 0.99568],
                    [32, 0.99506], [34, 0.99440], [36, 0.99372], [38, 0.99300], [40, 0.99225],
                    [42, 0.99147], [44, 0.99070], [46, 0.98980], [48, 0.98900], [50, 0.98810],
                    [52, 0.98720], [54, 0.98620], [56, 0.98530], [58, 0.98430], [60, 0.98320],
                    [62, 0.98220], [64, 0.98110], [66, 0.98010], [68, 0.97890], [70, 0.97780],
                    [72, 0.97670], [74, 0.97550], [76, 0.97430], [78, 0.97310], [80, 0.97180],
                    [82, 0.97060], [84, 0.96930], [86, 0.96800], [88, 0.96670], [90, 0.96530],
                    [92, 0.96400], [94, 0.96260], [96, 0.96120], [98, 0.95980], [100, 0.95840]
                ];

                samples.forEach(sample => {
                    const volumeInput = parseFloat(sample.querySelector(".pycnometer-volume").value);
                    const volumeUnit = sample.querySelector(".volume-unit").value;
                    const pycnometerWeight = parseFloat(sample.querySelector(".pycnometer-weight").value);
                    const drySoilWeight = parseFloat(sample.querySelector(".dry-soil-weight").value);
                    const pycnometerSoilWaterWeight = parseFloat(sample.querySelector(".pycnometer-soil-water-weight").value);
                    const temperature = parseFloat(sample.querySelector(".temperature").value);

                    if (isNaN(volumeInput) || isNaN(pycnometerWeight) || isNaN(drySoilWeight) || isNaN(pycnometerSoilWaterWeight) || isNaN(temperature) ||
                        volumeInput <= 0 || pycnometerWeight < 0 || drySoilWeight <= 0 || pycnometerSoilWaterWeight <= 0 || temperature < 0 || temperature > 100) {
                        sample.querySelector(".sample-result").textContent = "Некорректные данные";
                        return;
                    }

                    // Конверсия объёма в мл
                    let volumeMl = volumeInput;
                    if (volumeUnit === 'cm3') volumeMl = volumeInput;
                    else if (volumeUnit === 'l') volumeMl = volumeInput * 1000;

                    // Интерполяция плотности воды по температуре
                    let waterDensity = 1.00000; // Значение по умолчанию (4°C)
                    for (let i = 0; i < waterDensityData.length - 1; i++) {
                        if (temperature >= waterDensityData[i][0] && temperature <= waterDensityData[i + 1][0]) {
                            const t1 = waterDensityData[i][0];
                            const d1 = waterDensityData[i][1];
                            const t2 = waterDensityData[i + 1][0];
                            const d2 = waterDensityData[i + 1][1];
                            waterDensity = d1 + (d2 - d1) * (temperature - t1) / (t2 - t1);
                            break;
                        }
                    }

                    // Вес пикнометра с водой при заданной температуре
                    const waterWeight = volumeMl * waterDensity;
                    const pycnometerWithWaterWeight = pycnometerWeight + waterWeight;

                    // Расчёт плотности частиц грунта
                    const numerator = waterDensity * drySoilWeight;
                    const denominator = drySoilWeight + pycnometerWithWaterWeight - pycnometerSoilWaterWeight;
                    const density = numerator / denominator;

                    sample.querySelector(".sample-result").textContent = `${density.toFixed(3)} г/см³`;
                    densityValues.push(density);
                });
            }

            const avg = densityValues.length >= 1 
                ? densityValues.reduce((sum, val) => sum + val, 0) / densityValues.length 
                : null;
            block.querySelector(".density-value").textContent = avg ? `${avg.toFixed(3)} г/см³` : "Н/Д";
        }
    };

    App.init();
</script>
</body>
</html>
